# Entrypoint único de DX. Todo comando do projeto passa por aqui.
#
# go-task em vez de make: `make` no Windows exige instalar um port do GNU Make,
# e o desafio pede que a aplicação seja multiplataforma. O go-task instala com
# `go install`, que quem for avaliar já tem por causa do backend em Go.
#
#   go install github.com/go-task/task/v3/cmd/task@latest
version: "3"

silent: true

tasks:
  default:
    desc: Lista as tarefas disponíveis
    cmds:
      - task --list

  setup:
    desc: Baixa dependências do backend
    cmds:
      - cd backend && go mod download

  build:
    desc: Compila o binário do servidor
    cmds:
      - cd backend && go build -o ../bin/server ./cmd/server

  dev:api:
    desc: Sobe o backend
    cmds:
      - cd backend && go run ./cmd/server run {{.CLI_ARGS}}

  test:
    desc: Roda os testes do backend
    cmds:
      - cd backend && go test ./...

  fmt:
    desc: Formata o código Go
    cmds:
      - cd backend && go fmt ./...

  vet:
    desc: Análise estática do backend
    cmds:
      - cd backend && go vet ./...
