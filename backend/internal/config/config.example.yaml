# Configuração de exemplo do backend.
#
# Copie para config.yaml (que está no .gitignore) e ajuste:
#   cp config.example.yaml config.yaml
#
# Toda chave aqui tem um equivalente em variável de ambiente com o prefixo FB_
# e "." trocado por "_", e em flag de linha de comando. A precedência é:
#   flag > variável de ambiente > este arquivo > default
#
# Nenhum segredo real entra neste arquivo — ele é versionado.

# Endereço de escuta do servidor.
#   env:  FB_ADDRESS
#   flag: --address
address: "localhost:8080"

# Origem do frontend. É a base do link público de um formulário publicado,
# então precisa apontar para onde o navegador realmente acessa a aplicação.
#   env:  FB_PUBLIC_BASE_URL
#   flag: --public-base-url
public_base_url: "http://localhost:5173"

database:
  # Arquivo SQLite. Criado no primeiro boot, junto com o schema.
  # Chave aninhada: o "." vira "_" na variável de ambiente.
  #   env:  FB_DATABASE_PATH
  #   flag: --db-path
  path: "./formbuilder.db"

auth:
  # Segredo de assinatura da sessão. OBRIGATÓRIO, mínimo 32 bytes.
  #
  # O servidor RECUSA subir com o valor abaixo — ele está publicado no
  # repositório e assinaria sessões forjáveis por qualquer um. Gere o seu:
  #
  #   openssl rand -base64 48
  #   # ou, sem openssl:
  #   go run -e 'package main;import("crypto/rand";"encoding/base64";"fmt");func main(){b:=make([]byte,48);rand.Read(b);fmt.Println(base64.StdEncoding.EncodeToString(b))}'
  #
  #   env:  FB_AUTH_JWT_SECRET
  #   flag: --jwt-secret
  jwt_secret: "troque-isto-por-um-segredo-de-no-minimo-32-bytes"

  # Validade da sessão. Curta de propósito: o JWT não tem revogação no
  # servidor, então um token vazado vale até expirar.
  #   env:  FB_AUTH_SESSION_TTL
  #   flag: --session-ttl
  session_ttl: "24h"

  # Login com Google. OPCIONAL — deixando vazio, o servidor sobe normalmente,
  # loga um aviso, e o botão "Entrar com Google" avisa que não está
  # configurado. Todo o resto da aplicação funciona com e-mail e senha.
  #
  # Para habilitar, crie um "ID do cliente OAuth" do tipo Aplicativo da Web em
  # https://console.cloud.google.com/apis/credentials e registre EXATAMENTE
  # esta URI de redirecionamento:
  #
  #     http://localhost:8080/api/v1/auth/google/callback
  #
  # Qualquer diferença (barra no fim, 127.0.0.1 em vez de localhost, https)
  # faz o Google recusar com redirect_uri_mismatch.
  google:
    #   env:  FB_AUTH_GOOGLE_CLIENT_ID
    #   flag: --google-client-id
    client_id: ""
    # Nunca chega ao navegador nem ao bundle do frontend: a troca do código
    # por token acontece no servidor.
    #   env:  FB_AUTH_GOOGLE_CLIENT_SECRET
    #   flag: --google-client-secret
    client_secret: ""
    # Fixo e registrado no console do Google. Não é aceito por query param —
    # isso viraria open redirect, e o código de autorização seria entregue no
    # domínio do atacante.
    #   env:  FB_AUTH_GOOGLE_REDIRECT_URL
    #   flag: --google-redirect-url
    redirect_url: "http://localhost:8080/api/v1/auth/google/callback"
